<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan de producción</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 32px 20px;
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            color: #243247;
        }

        main {
            max-width: 1400px;
            margin: auto;
        }

        h1 { margin: 0 0 8px; }

        .descripcion {
            color: #64748b;
            margin-bottom: 24px;
        }

        .tarjeta {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 16px #24324708;
        }

        form {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        input[type="file"] {
            max-width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
        }

        button {
            border: 0;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            padding: 12px 20px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover { background: #1d4ed8; }

        #estado {
            font-size: 14px;
            color: #64748b;
        }

        #estado.error { color: #b91c1c; }

        #tabla { overflow-x: auto; }

        #tabla table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }

        #tabla th,
        #tabla td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        #tabla th {
            background: #eff6ff;
            color: #1e40af;
        }

        #tabla tbody tr:hover { background: #f8fafc; }
        #tabla {
    max-height: 65vh;
    overflow: auto;
    scroll-behavior: auto;
}

#tabla th {
    position: sticky;
    top: 0;
    z-index: 1;
    background: #eff6ff;
}

    </style>
</head>
<body>
<main>
    
    <section class="tarjeta">
        <form action="upPlan.php" method="POST" enctype="multipart/form-data">
            <label for="csv_file">Archivo CSV</label>
            <input
                type="file"
                id="csv_file"
                name="csv_file"
                accept=".csv"
                required
            >
            <button type="submit" name="upload" value="1">
                Cargar CSV
            </button>
        </form>
    </section>

    <section class="tarjeta">
        <p id="estado" role="status">Cargando tabla…</p>
        <div id="tabla" aria-busy="true"></div>
    </section>
</main>

<script>
const tabla = document.getElementById('tabla');
const estado = document.getElementById('estado');

let ultimoContenido = null;
let pausaHasta = 0;

async function cargarTabla() {
    tabla.setAttribute('aria-busy', 'true');

    try {
        const response = await fetch('tabla.php', {
            cache: 'no-store'
        });

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        const contenido = await response.text();

        if (contenido !== ultimoContenido) {
            const posicion = tabla.scrollTop;

            tabla.innerHTML = contenido;
            tabla.scrollTop = posicion;
            ultimoContenido = contenido;
        }

        estado.classList.remove('error');
        estado.textContent =
            'Última actualización: ' +
            new Date().toLocaleTimeString();
    } catch (error) {
        console.error('Error al cargar la tabla:', error);
        estado.classList.add('error');
        estado.textContent =
            'No se pudo actualizar la tabla: ' + error.message;
    } finally {
        tabla.setAttribute('aria-busy', 'false');
        setTimeout(cargarTabla, 5000);
    }
}

// Pausa durante cinco segundos cuando manipulas la tabla.
// Dejar el mouse encima ya no detiene el desplazamiento.
function pausarScroll() {
    pausaHasta = Date.now() + 5000;
}

tabla.addEventListener('wheel', pausarScroll, { passive: true });
tabla.addEventListener('touchstart', pausarScroll, { passive: true });
tabla.addEventListener('touchmove', pausarScroll, { passive: true });
tabla.addEventListener('pointerdown', pausarScroll);

setInterval(() => {
    if (Date.now() < pausaHasta) return;

    const limite = tabla.scrollHeight - tabla.clientHeight;

    if (limite > 0 && tabla.scrollTop < limite) {
        tabla.scrollTop = Math.min(tabla.scrollTop + 1, limite);
    }
}, 50);

cargarTabla();
</script>
</body>
</html>
